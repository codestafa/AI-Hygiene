name: Verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/setup-checks
      - name: Verify outgoing commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/verify.py range "$BASE_SHA" "$GITHUB_SHA"
      - name: Check the hooks and their regression tests
        run: |
          shellcheck scripts/setup-checks .githooks/*
          python3 -m unittest discover -s tests -v
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  review:
    name: Verify independent review
    needs: verify
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: read
    steps:
      - name: Require review of this merge candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" \
            --jq '[.statuses[] | select(.context == "Independent AI review")][0].state // "missing"')
          if [ "$state" != success ]; then
            echo "Independent review is $state for $GITHUB_SHA. See CONTRIBUTING.md."
            exit 1
          fi

  approval:
    name: Maintainer approval
    needs: review
    environment: maintainer-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: printf 'Approved merge candidate %s\n' "$GITHUB_SHA"
